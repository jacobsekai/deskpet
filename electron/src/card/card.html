<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; user-select: none;
      font: 12px -apple-system, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; color: #2a1d18; }
    .card { width: 270px; box-sizing: border-box; padding: 12px; border-radius: 14px; margin: 6px;
      background: rgba(250, 248, 246, 0.94); border: 1px solid rgba(0, 0, 0, 0.08); box-shadow: 0 8px 24px -8px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(20px); }
    .head { display: flex; align-items: center; gap: 6px; }
    .name { font-weight: 700; font-size: 13px; }
    .lv { font-size: 10.5px; font-weight: 800; padding: 2px 6px; border-radius: 999px; }
    .next { margin-left: auto; font-size: 10px; color: #8a7b74; }
    .bar { height: 5px; border-radius: 999px; background: rgba(0, 0, 0, 0.08); margin: 8px 0; overflow: hidden; }
    .bar div { height: 100%; border-radius: 999px; }
    .muted { color: #7a6a63; font-size: 11px; }
    .focus { font-weight: 600; margin-top: 6px; font-size: 11.5px; }
    hr { border: none; border-top: 1px solid rgba(0, 0, 0, 0.08); margin: 8px 0; }
    .row { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; padding: 4px; border-radius: 8px; cursor: pointer; }
    .row:hover { background: rgba(0, 0, 0, 0.05); }
    .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; }
    .title { font-weight: 600; }
    .tokens { font-size: 10px; color: #9a8b84; }
    .elapsed { font-size: 10.5px; color: #7a6a63; font-variant-numeric: tabular-nums; }
    .hint { font-size: 9.5px; color: #a89a93; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="card" id="card"></div>
  <script src="card.js"></script>
</body>
</html>
