<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Focus blocklist</title><link rel="stylesheet" href="dialog.css"></head>
<body>
  <h1>Focus blocklist</h1>
  <p>One site per line. During focus sessions the pet calls you out when one of these is the window you're looking at, or closes the tab in strict mode.</p>
  <textarea id="list" rows="9" spellcheck="false"></textarea>
  <label class="check"><input type="checkbox" id="enabled"> Block distracting sites during focus</label>
  <label class="check"><input type="checkbox" id="strict"> Strict: close blocked tabs</label>
  <div class="buttons">
    <button id="reset">Reset to defaults</button><span class="spacer"></span>
    <button id="cancel">Cancel</button><button id="save" class="primary">Save</button>
  </div>
  <script src="blocklist.js"></script>
</body></html>
