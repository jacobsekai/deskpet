<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Theme color</title>
  <style>
    body { font: 13px -apple-system, "Segoe UI", system-ui, sans-serif; margin: 18px; color: #222; }
    h1 { font-size: 15px; margin: 0 0 6px; }
    p { margin: 0 0 14px; color: #555; line-height: 1.4; }
    .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
    input[type=text] { flex: 1; font: inherit; padding: 6px 8px; border: 1px solid #bbb; border-radius: 6px; }
    input[type=text].invalid { border-color: #e33; background: #fff3f3; }
    input[type=color] { width: 40px; height: 32px; border: none; padding: 0; background: none; }
    .swatches { display: flex; gap: 6px; margin-bottom: 16px; }
    .swatches button { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #ccc; cursor: pointer; }
    .buttons { display: flex; gap: 8px; justify-content: flex-end; }
    .buttons button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid #bbb; background: #f5f5f5; cursor: pointer; }
    .buttons button.primary { background: #007aff; border-color: #007aff; color: #fff; }
    .buttons .spacer { flex: 1; }
  </style>
</head>
<body>
  <h1>Theme color</h1>
  <p>Enter a hex code. It tints speech and thought bubbles, captions, the "!" alert, and the resize box.</p>
  <div class="row">
    <input id="hex" type="text" placeholder="#FF8FB1" spellcheck="false" autofocus>
    <input id="picker" type="color" value="#ff8fb1">
  </div>
  <div class="swatches" id="swatches"></div>
  <div class="buttons">
    <button id="default">Default</button>
    <span class="spacer"></span>
    <button id="cancel">Cancel</button>
    <button id="apply" class="primary">Apply</button>
  </div>
  <script src="theme.js"></script>
</body>
</html>
