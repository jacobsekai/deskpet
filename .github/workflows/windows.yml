# Builds the Windows app on a real Windows machine, checks the PowerShell pieces,
# and attaches the zip to GitHub Releases.
name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: Companion engine (every conversation, reputation, reminders, sync)
        run: npm test

      - name: PowerShell scripts parse
        shell: powershell
        run: |
          foreach ($f in 'src/hook.ps1', 'src/windows-helper.ps1', 'src/windows-rects.ps1') {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors)
            if ($errors) { $errors; exit 1 }
          }

      - name: Hook writes session state
        shell: powershell
        run: |
          '{"hook_event_name":"PreToolUse","session_id":"ci-test","tool_name":"Edit","cwd":"C:\\demo"}' |
            powershell -NoProfile -ExecutionPolicy Bypass -File src/hook.ps1 -Agent claude
          $state = Get-Content "$env:USERPROFILE\.deskpet\sessions\claude-ci-test.json" -Raw | ConvertFrom-Json
          if ($state.event -ne 'PreToolUse' -or $state.tool -ne 'Edit') { throw "unexpected hook state: $state" }
          '{"hook_event_name":"SessionEnd","session_id":"ci-test"}' |
            powershell -NoProfile -ExecutionPolicy Bypass -File src/hook.ps1 -Agent claude
          if (Test-Path "$env:USERPROFILE\.deskpet\sessions\claude-ci-test.json") { throw "SessionEnd didn't remove the state file" }

      - name: Process helper emits a sample
        shell: powershell
        run: |
          $script = Resolve-Path src/windows-helper.ps1
          $job = Start-Job { powershell -NoProfile -ExecutionPolicy Bypass -File $using:script | Select-Object -First 1 }
          if (-not (Wait-Job $job -Timeout 90)) { throw "helper produced no output" }
          $sample = Receive-Job $job | ConvertFrom-Json
          "processes: $($sample.p.Count), foreground: $($sample.fg) / $($sample.fgTitle)"
          if ($sample.p.Count -lt 10) { throw "helper returned too few processes" }

      - name: Window helper lists windows
        shell: powershell
        run: |
          $script = (Get-Content src/windows-rects.ps1 -Raw).Replace('__SKIP_PID__', '0')
          Set-Content -Path rects-test.ps1 -Value $script
          $file = Resolve-Path rects-test.ps1
          $job = Start-Job { powershell -NoProfile -ExecutionPolicy Bypass -File $using:file | Select-Object -First 1 }
          if (-not (Wait-Job $job -Timeout 90)) { throw "window helper produced no output" }
          $rects = Receive-Job $job | ConvertFrom-Json
          "windows: $(@($rects).Count)"

      - name: Kiro hook writes session state
        shell: powershell
        run: |
          '{"cwd":"C:\\demo","tool_name":"fs_write"}' |
            powershell -NoProfile -ExecutionPolicy Bypass -File src/hook.ps1 -Agent kiro -Event preToolUse
          $f = Get-ChildItem "$env:USERPROFILE\.deskpet\sessions\kiro-*.json" | Select-Object -First 1
          $state = Get-Content $f.FullName -Raw | ConvertFrom-Json
          if ($state.event -ne 'PreToolUse' -or $state.tool -ne 'fs_write') { throw "unexpected kiro hook state: $state" }

      - name: Google sign-in client (from the GOOGLE_OAUTH_JSON secret; without it the Google Drive option stays hidden)
        shell: bash
        env:
          GOOGLE_OAUTH_JSON: ${{ secrets.GOOGLE_OAUTH_JSON }}
        run: |
          if [ -n "$GOOGLE_OAUTH_JSON" ]; then printf '%s' "$GOOGLE_OAUTH_JSON" > src/google-oauth.json; echo "added"; else echo "::warning::GOOGLE_OAUTH_JSON isn't set; building without Google sign-in"; fi

      - name: Package
        run: npx electron-packager . DeskPet --platform=win32 --arch=x64 --out=dist --overwrite --icon=assets/icon.ico --ignore=^/dist --ignore=^/test-output --ignore=^/test/

      - name: Updater swap (a release-style zip over an older copy; other files kept; logged)
        shell: powershell
        run: |
          $t = Join-Path $env:RUNNER_TEMP 'swap'
          New-Item -ItemType Directory -Force -Path "$t\old\DeskPet", "$t\work" | Out-Null
          Copy-Item dist\DeskPet-win32-x64\DeskPet.exe "$t\old\DeskPet\DeskPet.exe"
          Set-Content "$t\old\DeskPet\keep.txt" 'mine'
          Compress-Archive -Path dist\DeskPet-win32-x64 -DestinationPath "$t\work\update.zip"
          $env:SWAP_DIR = $t
          node -e "const { swapScript } = require('./src/extras'); const p = require('path'); const t = process.env.SWAP_DIR; require('fs').writeFileSync(p.join(t, 'swap.ps1'), swapScript({ exe: p.join(t, 'old', 'DeskPet', 'DeskPet.exe'), zip: p.join(t, 'work', 'update.zip'), work: p.join(t, 'work'), log: p.join(t, 'update.log'), relaunch: false }))"
          powershell -NoProfile -ExecutionPolicy Bypass -File "$t\swap.ps1"
          Get-Content "$t\update.log"
          if (-not (Test-Path "$t\old\DeskPet\resources\app\package.json")) { throw 'the new version was not copied in' }
          if ((Get-Content "$t\old\DeskPet\keep.txt") -ne 'mine') { throw 'other files in the folder were touched' }
          if (-not (Select-String -Path "$t\update.log" -Pattern 'copied the new version' -Quiet)) { throw 'the log does not say it copied' }
          if (Select-String -Path "$t\update.log" -Pattern "tar didn't work" -Quiet) { Write-Host "::warning::tar couldn't read the release zip; Expand-Archive was used" }

      - name: Smoke test (starts, detects, quits)
        continue-on-error: true
        shell: powershell
        run: |
          $p = Start-Process dist\DeskPet-win32-x64\DeskPet.exe -ArgumentList '--self-test' -PassThru -RedirectStandardOutput self-test.txt -RedirectStandardError self-test-err.txt
          $exited = $p.WaitForExit(60000)
          if (-not $exited) { $p.Kill() }
          '--- stdout'; Get-Content self-test.txt
          '--- stderr'; Get-Content self-test-err.txt | Select-String -NotMatch 'gpu|GPU|DEP0169' | Select-Object -Last 40
          if (-not $exited -or $p.ExitCode -ne 0) { throw "self-test failed (exited: $exited, code: $($p.ExitCode))" }

      - name: Trip visitor (portable copy inside a trip folder)
        continue-on-error: true
        shell: powershell
        run: |
          $drive = Join-Path $env:RUNNER_TEMP 'FakeUSB'
          New-Item -ItemType Directory -Force $drive | Out-Null
          node -e "const t=require('./src/trips'); t.createTrip({ base: process.argv[1], profile: { app: 'deskpet', v: 1, config: { petName: 'Minori', ownerName: 'CI' }, settings: {}, stats: { xp: 500, days: {} }, companion: {} }, home: { device: 'ci-home', name: 'CI-Home', os: 'macOS' } })" $drive
          $trip = Join-Path $drive 'DeskPet Trip'
          Copy-Item -Recurse dist\DeskPet-win32-x64 (Join-Path $trip 'DeskPet-Windows')
          $p = Start-Process (Join-Path $trip 'DeskPet-Windows\DeskPet.exe') -ArgumentList '--self-test' -PassThru -RedirectStandardOutput visit.txt -RedirectStandardError visit-err.txt
          $exited = $p.WaitForExit(60000)
          if (-not $exited) { $p.Kill() }
          Get-Content visit.txt | Select-String '"mode"|visiting|visitorSaved|failed'
          $t = Get-Content (Join-Path $trip 'trip.json') -Raw | ConvertFrom-Json
          "visits: $($t.visits.Count), xp now: $($t.profile.stats.xp)"
          if (-not (Select-String -Path visit.txt -Pattern '"mode": "visiting"' -Quiet) -or $t.visits.Count -ne 1) { throw "the portable visitor didn't start" }

      - name: Zip
        shell: powershell
        run: Compress-Archive -Path dist\DeskPet-win32-x64 -DestinationPath dist\DeskPet-win32-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DeskPet-win32-x64
          path: electron/dist/DeskPet-win32-x64.zip

      - name: Attach to release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" dist/DeskPet-win32-x64.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
